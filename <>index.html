<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2 </title>
<style>
    body{
        background-color: rgb(229, 195, 154);
    }
</style>
</head>
<body>
    <h1>Rate A Movie</h1>
    <h5> Share your top pick movie and write a review!</h5>
    <img src="https://cdn-icons-png.flaticon.com/512/2798/2798007.png" width="150" length="150">
    <form> 
        <h3 for="movie title"> Movie Title: </h3>
        <textarea id="movie title" name="movie title" rows="3" cols="100" placeholder="Movie Title"></textarea>
        <br>
        <h3> Genres (select all that may apply):</h3>
        <input type="checkbox" id="genre1" value="Action">
        <label for="genre1"> Action </label>
        <input type="checkbox" id="genre2" value="Romance">
        <label for="genre2"> Romance </label>
        <input type="checkbox" id="genre3" value="Comedy">
        <label for="genre3"> Comedy </label>
        <input type="checkbox" id="genre4" value="Fantasy">
        <label for="genre4"> Fantasy </label>
        <input type="checkbox" id="genre5" value="Horror">
        <label for="genre5"> Horror </label>
        <input type="checkbox" id="genre6" value="Musical">
        <label for="genre6"> Musical </label>
        <br>
        <p> <h3>Rating:</h3></p>
        <input type="radio" id="1 star" name="answer" value="★">
        <label for="1 star"> ★ </label>
        <input type="radio" id="2 stars" name="answer" value="★★">
        <label for="2 stars"> ★★ </label>
        <input type="radio" id="3 stars" name="answer" value="★★★">
        <label for="3 stars"> ★★★ </label>
        <input type="radio" id="4 stars" name="answer" value="★★★★">
        <label for="4 stars"> ★★★★ </label>
        <input type="radio" id="5 stars" name="answer" value="★★★★★">
        <label for="5 stars"> ★★★★★ </label>
        <br> 
        <h3>Review:</h3>
        <label for="review">Share your thoughts!</label>
        <br>
        <textarea id="review" name="review" rows="6" cols="100" placeholder="Write your review here..."></textarea>
        <br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
